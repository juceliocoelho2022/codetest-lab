spring:
  application:
    name: codetest-lab
  datasource:
    url: jdbc:h2:mem:codetestlab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1100KB

server:
  port: 8080

codetest:
  execution:
    image: codetest-lab-runner:latest
    timeout-seconds: 20
    max-output-chars: 20000
    max-source-chars: 100000
    max-zip-bytes: 1048576
    max-zip-entries: 200
    max-extracted-bytes: 2000000
